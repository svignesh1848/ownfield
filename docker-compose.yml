services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: fieldforce, POSTGRES_PASSWORD: fieldforce, POSTGRES_DB: fieldforce }
    volumes: [dbdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://fieldforce:fieldforce@db:5432/fieldforce
      JWT_SECRET: ${JWT_SECRET:-please-change-me}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-change-me-now}
      UPLOAD_DIR: /data/uploads
      # Photos: local disk by default. Set PHOTO_STORAGE=s3 + the S3_* values to use an S3-compatible bucket.
      PHOTO_STORAGE: ${PHOTO_STORAGE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      DISK_ALERT_PCT: ${DISK_ALERT_PCT:-15}
    volumes: [uploads:/data/uploads]
volumes: { dbdata: {}, uploads: {} }
