name: Auto-merge Dependabot security updates
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        id: meta
      - name: Enable auto-merge for patch or minor security updates
        if: >
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          ALERT: ${{ steps.meta.outputs.alert-state }}
          GHSA: ${{ steps.meta.outputs.ghsa-ids }}
        run: |
          if [ -z "$ALERT" ] && [ -z "$GHSA" ]; then
            echo "Not a security update; leaving the PR for manual review."
            exit 0
          fi
          gh pr merge --auto --squash "$PR"
