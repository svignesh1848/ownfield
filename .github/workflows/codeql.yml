name: CodeQL
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  schedule: [{ cron: "0 2 * * 3" }]
permissions: { contents: read, security-events: write, actions: read }
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3
        with: { category: "/language:javascript-typescript" }
