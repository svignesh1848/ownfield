# Included inside the app server { } blocks. Installed by deploy/nginx-waf.sh.
limit_req zone=ownfield_general burst=60 nodelay;
limit_req zone=ownfield_login burst=10 nodelay;
limit_req_status 429;

location ~* /\.env { return 404; }
location ~* /\.git { return 404; }
location ~* /(wp-admin|wp-login\.php|xmlrpc\.php) { return 404; }
location ~* /phpmyadmin { return 404; }
# Encoded or raw path traversal in the original request URI.
if ($request_uri ~* "(\.\./|\.\.%2[fF]|%2[eE]%2[eE])") { return 404; }
