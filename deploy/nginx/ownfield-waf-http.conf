# OwnField WAF-lite (http context). Installed by deploy/nginx-waf.sh. Do not edit in place.
# Empty key skips the login zone for normal requests (nginx limit_req ignores an empty key).
map $uri $ownfield_login_ip {
    default "";
    ~^/api/auth/ $binary_remote_addr;
}
limit_req_zone $ownfield_login_ip zone=ownfield_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ownfield_general:10m rate=30r/s;
